name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SignalBudget
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install quality tools
        run: python -m pip install -c constraints.txt mypy ruff

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Install wheel
        run: python -m pip install dist/*.whl

      - name: Test installed CLI outside the repository
        working-directory: ${{ runner.temp }}
        run: signalbudget summarize

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Lint
        run: python -m ruff check src tests integration_tests

      - name: Type-check
        run: python -m mypy src tests integration_tests

      - name: Run exported-evidence contract test
        run: python -m unittest discover -s integration_tests -v

      - name: Verify evidence archive checksum
        working-directory: evidence
        run: sha256sum -c ./*.sha256.txt

      - name: Regenerate reports from the committed VM evidence
        env:
          SUITE_ID: 4ddc2989-4c84-49fe-801e-996c67a5702f
        run: |
          set -euo pipefail
          mkdir -p build/ci-evidence
          unzip -q evidence/*-posix.zip -d build/ci-evidence
          run="build/ci-evidence/${SUITE_ID}"
          signalbudget validate-detfuzz \
            --path "${run}/reports/suite-report.json" \
            --evidence-root "${run}/evidence" \
            --require-suite-contract > /dev/null
          signalbudget pareto-analysis \
            --output-dir build/ci-reports/phase-9 \
            --detfuzz-result "${run}/reports/suite-report.json" \
            --detfuzz-evidence-root "${run}/evidence" > /dev/null
          signalbudget explain-tradeoffs \
            --output-dir build/ci-reports/phase-10 \
            --detfuzz-result "${run}/reports/suite-report.json" \
            --detfuzz-evidence-root "${run}/evidence" > /dev/null
          # Pricing status is a function of the profile age at run time, so it is
          # the one line that legitimately drifts from the committed snapshot.
          # evidence/ carries copies of both reports for the evidence index, so
          # they are checked against the same regenerated output.
          diff -I '^Pricing status:' \
            build/ci-reports/phase-9/pareto-analysis.md \
            artifacts/phase-9/pareto-analysis.md
          diff -I '^Pricing status:' \
            build/ci-reports/phase-10/tradeoff-explanations.md \
            artifacts/phase-10/tradeoff-explanations.md
          diff -I '^Pricing status:' \
            build/ci-reports/phase-9/pareto-analysis.md \
            evidence/pareto-analysis.md
          diff -I '^Pricing status:' \
            build/ci-reports/phase-10/tradeoff-explanations.md \
            evidence/tradeoff-explanations.md
          python - <<'PY'
          import difflib
          import json
          from pathlib import Path

          pairs = (
              (
                  Path("build/ci-reports/phase-9/pareto-analysis.json"),
                  Path("artifacts/phase-9/pareto-analysis.json"),
              ),
              (
                  Path("build/ci-reports/phase-10/tradeoff-explanations.json"),
                  Path("artifacts/phase-10/tradeoff-explanations.json"),
              ),
          )
          runtime_pricing_fields = {"age_days", "fresh", "reason", "status"}

          def normalized(path: Path) -> dict[str, object]:
              payload = json.loads(path.read_text(encoding="utf-8"))
              payload.pop("pricing_status", None)
              pricing = payload.get("pricing")
              if isinstance(pricing, dict):
                  for field in runtime_pricing_fields:
                      pricing.pop(field, None)
              return payload

          failed = False
          for generated_path, committed_path in pairs:
              generated = json.dumps(normalized(generated_path), indent=2, sort_keys=True)
              committed = json.dumps(normalized(committed_path), indent=2, sort_keys=True)
              if generated == committed:
                  continue
              failed = True
              print(
                  "".join(
                      difflib.unified_diff(
                          committed.splitlines(keepends=True),
                          generated.splitlines(keepends=True),
                          fromfile=str(committed_path),
                          tofile=str(generated_path),
                      )
                  )
              )
          if failed:
              raise SystemExit("normalized JSON reports differ from committed artifacts")
          PY

      - name: Reject tampered evidence
        env:
          SUITE_ID: 4ddc2989-4c84-49fe-801e-996c67a5702f
        run: |
          set -euo pipefail
          run="build/ci-evidence/${SUITE_ID}"
          printf ' ' >> "${run}/evidence/B0/case-record.json"
          if signalbudget validate-detfuzz \
            --path "${run}/reports/suite-report.json" \
            --evidence-root "${run}/evidence" \
            --require-suite-contract > /dev/null 2>&1; then
            echo "expected tampered evidence to be rejected" >&2
            exit 1
          fi
